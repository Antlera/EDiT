[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edit"
version = "0.1.0"
description = "A lightweight, editable inference engine for diffusion transformers (DiTs)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.4",
    "diffusers>=0.35",
    "transformers>=4.49",
    "accelerate>=0.34",
    "ftfy",
    "numpy",
    "imageio",
    "imageio-ffmpeg",
]

[project.urls]
Homepage = "https://github.com/Antlera/EDiT"

[tool.setuptools]
packages = ["edit", "edit.cache", "edit.cache.policies"]

# Pull torch from the CUDA 12.8 wheel index (uv only). The default PyPI torch is
# built for CUDA 13.0, which needs a newer NVIDIA driver than CUDA-12.8 setups
# have. Bump to cu130/cu126/etc. to match your own driver if different.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
